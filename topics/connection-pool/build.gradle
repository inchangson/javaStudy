dependencies {
    implementation 'io.lettuce:lettuce-core:6.5.5.RELEASE'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'com.h2database:h2:2.3.232'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'org.apache.commons:commons-pool2:2.12.1'
}

tasks.register('runDemo', JavaExec) {
    group = 'application'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = providers.gradleProperty('demo').orElse('poolstudy.semaphore.SemaphoreDemo')
}

test {
    useJUnitPlatform { excludeTags 'redis' }
}

tasks.register('redisTest', Test) {
    description = 'Real Redis integration tests; requires REDIS_URI or scripts/verify-redis.sh'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'redis' }
    outputs.upToDateWhen { false }
}

configurations { lessonSources { transitive = false } }
dependencies {
    lessonSources 'org.apache.commons:commons-pool2:2.12.1:sources'
    lessonSources 'com.zaxxer:HikariCP:6.3.0:sources'
    lessonSources 'io.lettuce:lettuce-core:6.5.5.RELEASE:sources'
    lessonSources 'com.h2database:h2:2.3.232:sources'
}
tasks.register('downloadSources', Copy) {
    description = 'Download the exact library sources read by the lessons'
    group = 'documentation'
    from configurations.lessonSources
    into layout.buildDirectory.dir('library-sources')
}
tasks.named('runDemo', JavaExec) {
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
}
